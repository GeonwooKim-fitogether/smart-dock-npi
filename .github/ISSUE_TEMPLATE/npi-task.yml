name: NPI 태스크 (표준 외 추가)
description: 등급별 Fitstack NPI 태스크 말고 이 프로젝트에 필요한 할 일을 더할 때 쓴다(83개 라이브러리 npi/task-library.csv 에서 고른 것 포함). 등급별 태스크는 npi/npi_github.py 가 미리 만든다.
title: "[추가] "
labels: ["NPI 태스크"]
body:
  - type: markdown
    attributes:
      value: |
        만든 뒤 오른쪽 **Milestone** 에서 단계를 고르고, **Labels** 에서 담당 역할 라벨(`역할:PM` · `HW` · `FW` · `ME` · `QA` · `PROD` · `SCM`)을 하나 더한다.
        제목 앞의 `[추가]` 는 숫자로 바꾸지 않는다. `[숫자]` 는 Fitstack 태스크 번호 자리라, 겹치면 스크립트가 같은 태스크로 보고 건너뛴다. 단계 통과(Phase Review)는 Fitstack 에서 한다. 사용법: `docs/how-to-work.md`
  - type: textarea
    id: goal
    attributes:
      label: 할 일과 완료 기준
      description: 무엇이 되면 이 이슈를 닫을 수 있는가
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 산출물·근거
      description: PDF, 시험 결과, 관련 이슈 링크. 나중에 댓글로 더해도 된다.
